# tangier's own gates. `tangier gate run <name>` runs one and records the pass;
# CI runs the same command. See `docs/specs/gate.md`.

# One member for each supported Python: 3.11 is the floor (tomllib), and 3.12
# is what a bare GitHub runner provides. Each member keeps its own record, so
# one version's pass is recorded even when another version fails.
#
# `python`, not `bin/test`: `uv run` resolves `python` to the requested version,
# but `bin/test` calls `python3`, which another interpreter on PATH can shadow.
[gate.test]
scope = ["gate-inputs"]

[gate.test.py311]
cmd = "uv run --no-project --python 3.11 python -m unittest discover -s tangier -p test_*.py -t ."

[gate.test.py312]
cmd = "uv run --no-project --python 3.12 python -m unittest discover -s tangier -p test_*.py -t ."

[gate.test.py313]
cmd = "uv run --no-project --python 3.13 python -m unittest discover -s tangier -p test_*.py -t ."

[gate.lint]
scope = ["gate-inputs"]

[gate.lint.check]
cmd = "ruff check ."

[gate.lint.format]
cmd = "ruff format --check ."

[gate-inputs]
paths = ["tangier/**", "pyproject.toml", "pipeline.toml"]
