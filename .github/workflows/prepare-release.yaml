name: Prepare release

# Run from Actions -> Prepare release -> Run workflow. It opens a version PR;
# merging it releases, through release.yaml. CONTRIBUTING.md has the process and
# the one-time setup.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version moves
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: An exact version, such as 1.2.3, in place of the bump
        type: string
        default: ""
      reason:
        description: Why the version moves, for the commit and PR body
        type: string
        default: ""

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # main only: the PR's version commit sits on main's head.
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Prepare release runs from main, not $GITHUB_REF"
          exit 1
      # No saved credentials: only the step that pushes gets a write token, as a
      # credential helper in its env.
      - uses: actions/checkout@v5
        with:
          # Every tag, to compare against the highest released version.
          fetch-depth: 0
          persist-credentials: false
      - name: Check main has something to release
        run: |
          set -euo pipefail
          released="$(git tag -l --points-at HEAD 'v*.*.*')"
          if [ -n "$released" ]; then
            echo "::error::main is still at $released: nothing to release"
            exit 1
          fi
      - id: bump
        env:
          BUMP: ${{ inputs.version || inputs.bump }}
        run: bin/release-bump "$BUMP" >> "$GITHUB_OUTPUT"
      - id: commit
        name: Commit the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REASON" ]; then
            git commit -qam "chore: version $VERSION" -m "$REASON"
          else
            git commit -qam "chore: version $VERSION"
          fi
          # Refuses a version that is already tagged, or not above the highest tag.
          plan="$(bin/release-plan HEAD)"
          if ! grep -x 'release=true' <<<"$plan" >/dev/null; then
            echo "::error::bin/release-plan will not release $VERSION"
            exit 1
          fi
          echo "$plan" >> "$GITHUB_OUTPUT"
      - name: Push the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          VERSION: ${{ steps.bump.outputs.version }}
        # Replaces only a branch that holds nothing but an earlier run's version
        # commit, so a commit pushed to the version PR is never lost.
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          lease="refs/heads/$branch:"
          if git fetch -q origin "refs/heads/$branch" 2>/dev/null; then
            if [ "$(git rev-list --count HEAD^..FETCH_HEAD)" != 1 ] ||
               [ "$(git log -1 --format='%an|%s' FETCH_HEAD)" != "github-actions[bot]|chore: version $VERSION" ]; then
              echo "::error::$branch holds commits of its own: merge or close its PR and delete the branch first"
              exit 1
            fi
            lease="refs/heads/$branch:$(git rev-parse FETCH_HEAD)"
          fi
          git push --force-with-lease="$lease" origin "HEAD:refs/heads/$branch"
      - name: Open the version PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PREVIOUS: ${{ steps.commit.outputs.previous }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          args=(-f "tag_name=v$VERSION" -f "target_commitish=$branch")
          if [ -n "$PREVIOUS" ]; then args+=(-f "previous_tag_name=v$PREVIOUS"); fi
          body="$RUNNER_TEMP/pr.md"
          {
            if [ -n "$REASON" ]; then printf '%s\n\n' "$REASON"; fi
            echo "Merging this releases v$VERSION: release.yaml publishes it to PyPI, tags it, and moves the @v0 alias once CI passes on main."
            echo
            echo "## ${PREVIOUS:+v$PREVIOUS -> }v$VERSION"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          # A re-run updates the version PR if it is still open, and opens one if not.
          if url="$(gh pr view "$branch" --json url,state --jq 'select(.state == "OPEN") | .url' 2>/dev/null)" && [ -n "$url" ]; then
            gh pr edit "$branch" --body-file "$body"
          else
            url="$(gh pr create --base main --head "$branch" --title "chore: version $VERSION" --body-file "$body")"
          fi
          echo "Version PR: $url" >> "$GITHUB_STEP_SUMMARY"
      # A push or PR made with GITHUB_TOKEN starts no CI run, but a dispatch does.
      # Its checks land on the branch's head commit, which is the PR's.
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run ci.yaml --ref "release/v$VERSION"
