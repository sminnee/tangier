name: CI

# No push to main: release.yaml calls this as the full run on the commit it publishes.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    # The Python versions are members of the `[gate.test]` group in pipeline.toml.
    # One step for each member, so each version reports and reuses its own record.
    # Each member runs only the test directories the diff reaches.
    runs-on: ubuntu-latest
    steps:
      # Depth 20 follows the checkout-depth rule in skills/tangier/reference/
      # github-actions.md. These gates have no placeholder, so they need only HEAD^1.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          # A verified gate never calls uv, and an empty cache fails the post step.
          enable-cache: false
      - name: Run test.py311
        # No setup-python: the runner's own Python runs tangier, which is the
        # environment tangier must work in.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request reuses a gate record. Any other event is the full
          # build that does not consult records.
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py311 "${flags[@]}"
      - name: Run test.py312
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py312 "${flags[@]}"
      - name: Run test.py313
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py313 "${flags[@]}"
      - name: CLI smoke check
        run: python3 -m tangier --help

  no-dependencies:
    # The check is `[gate.no-dependencies]` in pipeline.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - name: Run no-dependencies
        # No setup-python: the runner's own Python is the one tangier must work on.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run no-dependencies "${flags[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false
      - run: uv tool install ruff
      - name: Run lint.check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run lint.check "${flags[@]}"
      - name: Run lint.format
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run lint.format "${flags[@]}"

  plan:
    # The touched tags in pipeline.toml, for the jobs below that are not gates.
    # A pull request diffs against HEAD^1, the merge base. A release is the full
    # run, which touches every tag.
    runs-on: ubuntu-latest
    outputs:
      build-action-touched: ${{ steps.changes.outputs.build-action-touched }}
      install-tangier-touched: ${{ steps.changes.outputs.install-tangier-touched }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Changed tags
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then flags=(--base HEAD^1); else flags=(--full); fi
          python3 -m tangier changemap github-outputs "${flags[@]}"

  build-action:
    # Runs the build action as a caller whose `[tool.uv] required-version` is
    # `>=0.13`, then runs the uv it left on PATH in that checkout. The job fails
    # if the action installs a uv the caller rejects.
    #
    # GHCR rather than a `registry:2` service: the action's docker-container
    # buildx builder cannot reach `localhost:5000`. A fork's token cannot push
    # to GHCR, so forks skip. It also skips unless the diff touches the
    # `build-action` tag in pipeline.toml: a real docker build is too slow to
    # run for a change the build action cannot see.
    needs: plan
    if: >-
      needs.plan.outputs.build-action-touched == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: tangier
      - name: Make the workspace the fixture caller
        # tangier hashes the git tree, so the fixture needs a repo of its own.
        run: |
          set -euo pipefail
          cp -R tangier/.github/fixtures/uv-caller/. .
          git init -q
          git add -A
          git -c user.name=tangier-ci -c user.email=ci@tangier.invalid commit -q -m fixture
      - id: build
        uses: ./tangier/.github/actions/build
        with:
          package: fixture
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          tangier-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run the action's uv in the caller's checkout
        # The command setup-uv's post step used to run. setup-uv no longer prunes
        # by default, so the job runs it itself; uv exits 2 if its version fails
        # the caller's `required-version`.
        run: uv cache prune --ci
      - name: Check the tag output
        # Not `published`: the tag is content-addressed, so every run after the
        # first skips the build.
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          test -n "$TAG" || { echo "::error::the build action emitted no tag"; exit 1; }
          echo "tag=$TAG"

  install-tangier:
    # Runs the install script each way it can install, and checks the version
    # each one gives. The build-action job covers only the git ref.
    needs: plan
    if: needs.plan.outputs.install-tangier-touched == 'true'
    runs-on: ubuntu-latest
    env:
      INSTALL: .github/actions/build/install-tangier.sh
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false
      - name: A pinned release
        env:
          INPUT_VERSION: "0.3.0"
        run: |
          set -euo pipefail
          bash "$INSTALL"
          test "$(tangier --version)" = "tangier 0.3.0"
      - name: The latest release
        # After the pinned one, so this also checks that `--upgrade` moves an existing install.
        run: |
          set -euo pipefail
          bash "$INSTALL"
          want="$(curl -fsSL https://pypi.org/pypi/tangier/json | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])')"
          test "$(tangier --version)" = "tangier $want"
      - name: This commit, by ref
        env:
          INPUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          bash "$INSTALL"
          test "$(tangier --version)" = "tangier $(python3 -c 'import tangier; print(tangier.__version__)')"
      - name: A version and a ref together fail
        env:
          INPUT_VERSION: "0.3.0"
          INPUT_REF: ${{ github.sha }}
        run: |
          if bash "$INSTALL"; then echo "::error::the script accepted both a version and a ref"; exit 1; fi

  lint-actions:
    # `action-validator` covers `actions/*/action.yaml`, the file type nothing
    # in this estate lints today. `actionlint` shellchecks every `run:` body,
    # which is the higher-value of the two given these actions are mostly shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: action-validator
        # One file per invocation — the CLI takes a single path.
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yaml .github/actions/*/action.yaml; do
            echo "validating $f"
            npx --yes @action-validator/cli@0.6.0 "$f"
          done
      - name: actionlint
        # Covers workflows only — composite `action.yaml` files are the next step.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: shellcheck composite action run bodies
        # actionlint shellchecks `run:` bodies in WORKFLOWS but does not read
        # `actions/*/action.yaml`, so these scripts are otherwise unlinted — and
        # they are mostly shell. Extract each body and check it directly.
        run: |
          set -euo pipefail
          # Cleared, not just created: stale extracts from an earlier run would
          # otherwise be checked against code no longer in the tree.
          rm -rf "$RUNNER_TEMP/sc"
          mkdir -p "$RUNNER_TEMP/sc"
          python3 - <<'PY'
          import os, re
          out = os.path.join(os.environ["RUNNER_TEMP"], "sc")
          for name in sorted(os.listdir(".github/actions")):
              path = f".github/actions/{name}/action.yaml"
              if not os.path.exists(path):
                  continue
              text = open(path).read()
              for i, block in enumerate(re.findall(r"      run: \|\n((?:        .*\n|\n)+)", text)):
                  body = "\n".join(line[8:] for line in block.splitlines())
                  with open(os.path.join(out, f"{name}_{i}.sh"), "w") as fh:
                      fh.write("#!/bin/bash\n" + body + "\n")
          PY
          count=$(find "$RUNNER_TEMP/sc" -name '*.sh' | wc -l)
          test "$count" -gt 0 || { echo "::error::extracted no run bodies — the regex has drifted"; exit 1; }
          echo "shellchecking $count run bodies, plus bin/ and action scripts"
          find "$RUNNER_TEMP/sc" -name '*.sh' -print0 | xargs -0 shellcheck
          # bin/ is otherwise ungated.
          # `parity-check` is excluded until its pre-existing SC2015 is fixed.
          shellcheck bin/test .github/actions/*/*.sh
