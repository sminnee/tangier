name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The Python versions are members of the `[gate.test]` group in pipeline.toml.
    # One step for each member, so each version reports and reuses its own record.
    runs-on: ubuntu-latest
    steps:
      # Depth 20 follows the checkout-depth rule in skills/tangier/reference/
      # github-actions.md. These gates have no placeholder, so they need only HEAD^1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: astral-sh/setup-uv@v6
        with:
          # A verified gate never calls uv, and an empty cache fails the post step.
          enable-cache: false
      - name: Run test.py311
        # No setup-python: the runner's own Python runs tangier, which is the
        # environment tangier must work in.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A pull request reuses a gate record. Any other event is the full
          # build that does not consult records.
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py311 "${flags[@]}"
      - name: Run test.py312
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py312 "${flags[@]}"
      - name: Run test.py313
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run test.py313 "${flags[@]}"
      - name: CLI smoke check
        run: python3 -m tangier --help

  no-dependencies:
    # The check is `[gate.no-dependencies]` in pipeline.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Run no-dependencies
        # No setup-python: the runner's own Python is the one tangier must work on.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run no-dependencies "${flags[@]}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uv tool install ruff
      - name: Run lint.check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run lint.check "${flags[@]}"
      - name: Run lint.format
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags=(--read-only)
          if [ "$EVENT" = pull_request ]; then flags+=(--base HEAD^1); else flags+=(--full); fi
          python3 -m tangier gate run lint.format "${flags[@]}"

  lint-actions:
    # `action-validator` covers `actions/*/action.yaml`, the file type nothing
    # in this estate lints today. `actionlint` shellchecks every `run:` body,
    # which is the higher-value of the two given these actions are mostly shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: action-validator
        # One file per invocation — the CLI takes a single path.
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yaml .github/actions/*/action.yaml; do
            echo "validating $f"
            npx --yes @action-validator/cli@0.6.0 "$f"
          done
      - name: actionlint
        # Covers workflows only — composite `action.yaml` files are the next step.
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: shellcheck composite action run bodies
        # actionlint shellchecks `run:` bodies in WORKFLOWS but does not read
        # `actions/*/action.yaml`, so these scripts are otherwise unlinted — and
        # they are mostly shell. Extract each body and check it directly.
        run: |
          set -euo pipefail
          # Cleared, not just created: stale extracts from an earlier run would
          # otherwise be checked against code no longer in the tree.
          rm -rf "$RUNNER_TEMP/sc"
          mkdir -p "$RUNNER_TEMP/sc"
          python3 - <<'PY'
          import os, re
          out = os.path.join(os.environ["RUNNER_TEMP"], "sc")
          for name in sorted(os.listdir(".github/actions")):
              path = f".github/actions/{name}/action.yaml"
              if not os.path.exists(path):
                  continue
              text = open(path).read()
              for i, block in enumerate(re.findall(r"      run: \|\n((?:        .*\n|\n)+)", text)):
                  body = "\n".join(line[8:] for line in block.splitlines())
                  with open(os.path.join(out, f"{name}_{i}.sh"), "w") as fh:
                      fh.write("#!/bin/bash\n" + body + "\n")
          PY
          count=$(find "$RUNNER_TEMP/sc" -name '*.sh' | wc -l)
          test "$count" -gt 0 || { echo "::error::extracted no run bodies — the regex has drifted"; exit 1; }
          echo "shellchecking $count run bodies, plus bin/"
          find "$RUNNER_TEMP/sc" -name '*.sh' -print0 | xargs -0 shellcheck
          # bin/ is otherwise ungated, and bin/release-plan decides when @v0 moves.
          # `parity-check` is excluded until its pre-existing SC2015 is fixed.
          shellcheck bin/release-plan bin/test
