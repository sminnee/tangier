name: Release

# Run from Actions -> Release -> Run workflow, on main. It takes the version from
# the tags, runs CI on main's head, and publishes once the pypi environment allows.
# CONTRIBUTING.md has the process, re-runs, and the one-time setup.
# This must stay the top-level workflow: the publisher is registered to release.yaml.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version moves
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: An exact version, such as 1.2.3, in place of the bump
        type: string
        default: ""

# Queued, never cancelled: a second release plans only after the first has tagged.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release runs from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v5
        with:
          # Every tag, to find the highest release.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BUMP: ${{ inputs.version || inputs.bump }}
        run: |
          set -euo pipefail
          plan="$(bin/release-version next "$BUMP")"
          echo "$plan" >> "$GITHUB_OUTPUT"
          eval "$plan"
          echo "Releasing v$version ${previous:+after v$previous }from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      packages: write

  release:
    needs: [plan, ci]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      # No saved credentials: the build runs without a write token, and only the
      # steps that push get one, as a credential helper in their env.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # A re-run after the tag push finds the tag on this commit, and goes on.
      - name: Check the version is not released elsewhere
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tagged="$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)"
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION is already released at $tagged"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false
      - name: Build
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          bin/release-version stamp "$VERSION"
          uv build
          test "$(uvx --from "dist/tangier-$VERSION-py3-none-any.whl" tangier --version)" = "tangier $VERSION"
      # Pinned by commit: this job can publish as tangier, so a moved tag must not change what runs.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after a failed tag push finds the version already on PyPI.
          skip-existing: true
      # Tagged after publishing, so the alias never names a version PyPI lacks.
      - name: Tag the version and move the major alias
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v$VERSION"
          alias="${tag%%.*}"   # v0.2.2 -> v0
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "Release $tag" "$GITHUB_SHA"
          fi
          git tag -f -a "$alias" -m "Alias for $tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          git push -f origin "refs/tags/$alias"
      # Skipped when the release exists, so a re-run is a no-op.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          args=()
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "v$PREVIOUS"); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release"
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag" "${args[@]}"
          fi
