name: Release

# Release when CI passes on a push to main and bin/release-plan says the version
# is new. Prepare release opens the version PR whose merge does that.
# CONTRIBUTING.md has the process, re-runs, and the one-time setup.
# This must stay the top-level workflow: the publisher is registered to release.yaml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  plan:
    # event == 'push': a fork PR from a branch named main, or CI dispatched by hand
    # on main, also matches branches: [main].
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # The workflow's own ref, not head_sha: bin/release-plan comes from the
      # same commit as this workflow, and judges head_sha through git show.
      - uses: actions/checkout@v5
        with:
          # Every tag, to compare against the highest released version.
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bin/release-plan "$SHA" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    # Job-level, so only real releases queue. A queued release may be replaced by
    # a newer one, which re-plans; a running one is never cancelled mid-publish.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      # No saved credentials: the build runs without a write token, and only the
      # steps that push get one, as a credential helper in their env.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Planned again: "Re-run failed jobs" reuses the plan job's old outputs, and
      # a release may have queued behind a newer one. Either could move v0 backwards.
      - id: recheck
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: bin/release-plan "$SHA" >> "$GITHUB_OUTPUT"
      - if: steps.recheck.outputs.release == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: git checkout --detach "$SHA"
      - if: steps.recheck.outputs.release == 'true'
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: false
      - if: steps.recheck.outputs.release == 'true'
        run: uv build
      # Pinned by commit: this job can publish as tangier, so a moved tag must not change what runs.
      - if: steps.recheck.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A re-run after a failed tag push finds the version already on PyPI.
          skip-existing: true
      # Tagged after publishing, so the alias never names a version PyPI lacks.
      - name: Tag the version and move the major alias
        if: steps.recheck.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.recheck.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v$VERSION"
          alias="${tag%%.*}"   # v0.2.2 -> v0
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "Release $tag" "$SHA"
          fi
          git tag -f -a "$alias" -m "Alias for $tag" "$SHA"
          git push origin "refs/tags/$tag"
          git push -f origin "refs/tags/$alias"
      # Skipped when the release exists, so a re-run is a no-op.
      - name: Create the GitHub Release
        if: steps.recheck.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          VERSION: ${{ steps.recheck.outputs.version }}
          PREVIOUS: ${{ steps.recheck.outputs.previous }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # bin/release-plan's previous version, as in the version PR's preview.
          args=()
          if [ -n "$PREVIOUS" ]; then args+=(--notes-start-tag "v$PREVIOUS"); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a release"
          else
            gh release create "$tag" --verify-tag --generate-notes --title "$tag" "${args[@]}"
          fi
          # Prepare release's branch, if the merge did not delete it.
          if git ls-remote --exit-code origin "refs/heads/release/$tag" >/dev/null; then
            git push origin --delete "release/$tag"
          fi
