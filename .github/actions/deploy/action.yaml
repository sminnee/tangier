name: tangier deploy
description: >-
  Connect to the tailnet, then render and apply this environment's manifests
  with the current content-addressed image tags.

# READ docs/actions/tailnet.md BEFORE changing a call site. The separation
# between uat and prod is enforced by the `environment:` line on the calling
# job, and it is no longer visible from here.

inputs:
  env:
    description: Environment name. Must have a `[deploy.<env>]` table in pipeline.toml.
    required: true
  client-id:
    description: >-
      OAuth client ID for this environment's deploy identity. Pass the
      environment's `vars.TS_DEPLOY_CLIENT_ID` as an expression — a
      composite action cannot read the `vars` context (actions/runner#2551).
    required: true
  audience:
    description: >-
      OIDC audience for this environment. Pass the environment's
      `vars.TS_DEPLOY_AUDIENCE` as an expression.
    required: true
  tailscale-version:
    description: >-
      As the `tailnet` action's `version` input. Defaults to the release
      pinned in tailnet/resolve.sh.
    required: false
    default: ""
  uv-version:
    description: >-
      uv release for setup-uv. Empty reads the caller's `[tool.uv] required-version`
      and falls back to the latest release.
    required: false
    default: ""
  tangier-version:
    description: >-
      PyPI release of the CLI to install, such as `0.3.2`. Empty (the default)
      installs the latest. Pass the version the caller's `uvx` calls use: two
      versions can hash tags apart.
    required: false
    default: ""
  tangier-ref:
    description: >-
      Git ref to install the CLI from instead of PyPI, for testing an unreleased
      change. Cannot be combined with `tangier-version`.
    required: false
    default: ""
  registry-username:
    description: >-
      Username for the image registry, for the `[deploy] digests` lookup.
      Defaults to `registry`.
    required: false
    default: registry
  registry-password:
    description: >-
      Password for `[registry] url` when it is not Amazon ECR. Needed only with
      `[deploy] digests = true`, which reads each image's digest from the
      registry. Without it the deploy does not log in, and a registry that
      needs a login fails the lookup with a 401.
    required: false
    default: ""
  aws-role-arn:
    description: >-
      IAM role to assume through GitHub OIDC when `[registry] url` is Amazon
      ECR, for the `[deploy] digests` lookup. The job needs
      `permissions: id-token: write`, and the role must trust the deploy job's
      Environment. Without it the deploy does not log in.
    required: false
    default: ""
  regctl-version:
    description: regctl release to install, for the `[deploy] digests` lookup. Pinned, never `latest`.
    required: false
    default: v0.6.1

runs:
  using: composite
  steps:
    # The tailnet action's steps, not `uses: .../tailnet@v0`: a nested `uses:`
    # cannot follow this action's ref, so a caller pinning deploy would still
    # get whatever tailnet@v0 is now. resolve.sh comes from this checkout.
    # Keep these steps in step with .github/actions/tailnet/action.yaml.
    - name: Resolve the tag, operator and version
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ""
        INPUT_ENV: ${{ inputs.env }}
        INPUT_OPERATOR: ""
        INPUT_VERSION: ${{ inputs.tailscale-version }}
      run: bash "$GITHUB_ACTION_PATH/../tailnet/resolve.sh"

    - name: Connect to the tailnet
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.client-id }}
        audience: ${{ inputs.audience }}
        tags: ${{ steps.resolve.outputs.tag }}
        version: ${{ steps.resolve.outputs.version }}
        use-cache: "true"

    - name: Point kubectl at the operator
      shell: bash
      env:
        OPERATOR: ${{ steps.resolve.outputs.operator }}
      run: |
        set -euo pipefail
        tailscale configure kubeconfig "$OPERATOR"
        kubectl config current-context

    # uv itself is not pinned: this uv stays on PATH for the caller's later steps,
    # and any uv call in the caller's checkout must satisfy its `required-version`.
    - uses: astral-sh/setup-uv@v10.3.1
      with:
        version: ${{ inputs.uv-version }}

    - name: Install tangier
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.tangier-version }}
        INPUT_REF: ${{ inputs.tangier-ref }}
      run: bash "$GITHUB_ACTION_PATH/../build/install-tangier.sh"

    # regctl and the registry login serve `[deploy] digests`. Whether that is on
    # is not cheap to tell here, so regctl installs every run. These steps run
    # the build action's scripts.
    - name: Install regctl
      shell: bash
      env:
        REGCTL_VERSION: ${{ inputs.regctl-version }}
      run: bash "$GITHUB_ACTION_PATH/../build/install-regctl.sh"

    # A deploy reads `[registry] url` only, so mirrors are left out.
    - name: Registry login
      id: registry
      if: inputs.registry-password != '' || inputs.aws-role-arn != ''
      shell: bash
      env:
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
        AWS_ROLE_ARN: ${{ inputs.aws-role-arn }}
        MIRRORS: "false"
        REQUIRE: "false"
      run: bash "$GITHUB_ACTION_PATH/../build/registry-login.sh"

    # The AWS keys go to the ECR login step alone, not to $GITHUB_ENV. The
    # docker login it writes does stay for the rest of the job.
    - uses: aws-actions/configure-aws-credentials@v6
      id: aws
      if: steps.registry.outputs.ecr-hosts != ''
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ steps.registry.outputs.ecr-region }}
        output-credentials: true
        output-env-credentials: false

    - name: ECR login
      if: steps.registry.outputs.ecr-hosts != ''
      shell: bash
      env:
        ECR_HOSTS: ${{ steps.registry.outputs.ecr-hosts }}
        AWS_REGION: ${{ steps.registry.outputs.ecr-region }}
        AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
        AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
      run: bash "$GITHUB_ACTION_PATH/../build/ecr-login.sh"

    - name: Deploy
      shell: bash
      # `--summary` writes the build table to $GITHUB_STEP_SUMMARY before
      # anything is applied — pass 1 overwrites the deployed tags it reads, and
      # the table is most wanted when the deploy then fails.
      #
      # `set -euo pipefail` is a behaviour change from the bash this replaces,
      # which had no `set -e` and fell through a failing summary into the real
      # deploy. If it proves annoying, the relief valve is
      # `continue-on-error: true` on a separate summary step — not dropping
      # `set -e`.
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        tangier deploy "$DEPLOY_ENV" --summary
