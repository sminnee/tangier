name: tangier deploy
description: >-
  Connect to the tailnet, then render and apply this environment's manifests
  with the current content-addressed image tags.

# READ docs/actions/tailnet.md BEFORE changing a call site. The separation
# between uat and prod is enforced by the `environment:` line on the calling
# job, and it is no longer visible from here.

inputs:
  env:
    description: Environment name. Must have a `[deploy.<env>]` table in pipeline.toml.
    required: true
  client-id:
    description: >-
      OAuth client ID for this environment's deploy identity. Pass
      `${{ vars.TS_DEPLOY_CLIENT_ID }}` — a composite action cannot read the
      `vars` context (actions/runner#2551).
    required: true
  audience:
    description: OIDC audience for this environment. Pass `${{ vars.TS_DEPLOY_AUDIENCE }}`.
    required: true
  tailscale-version:
    description: >-
      As the `tailnet` action's `version` input. Defaults to the release
      pinned in tailnet/resolve.sh.
    required: false
    default: ""
  tangier-ref:
    description: >-
      The tangier ref to install the CLI from. Defaults to the ref this action
      was called at. Required when calling the action locally (`uses: ./...`),
      because `github.action_ref` is empty for a local path.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The tailnet action's steps, not `uses: .../tailnet@v0`: a nested `uses:`
    # cannot follow this action's ref, so a caller pinning deploy would still
    # get whatever tailnet@v0 is now. resolve.sh comes from this checkout.
    # Keep these steps in step with .github/actions/tailnet/action.yaml.
    - name: Resolve the tag, operator and version
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ""
        INPUT_ENV: ${{ inputs.env }}
        INPUT_OPERATOR: ""
        INPUT_VERSION: ${{ inputs.tailscale-version }}
      run: bash "$GITHUB_ACTION_PATH/../tailnet/resolve.sh"

    - name: Connect to the tailnet
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.client-id }}
        audience: ${{ inputs.audience }}
        tags: ${{ steps.resolve.outputs.tag }}
        version: ${{ steps.resolve.outputs.version }}
        use-cache: "true"
        args: --advertise-tags=${{ steps.resolve.outputs.tag }}

    - name: Point kubectl at the operator
      shell: bash
      env:
        OPERATOR: ${{ steps.resolve.outputs.operator }}
      run: |
        set -euo pipefail
        tailscale configure kubeconfig "$OPERATOR"
        kubectl config current-context

    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.5.29"

    - name: Install tangier
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        INPUT_REF: ${{ inputs.tangier-ref }}
      run: bash "$GITHUB_ACTION_PATH/../build/install-tangier.sh"

    - name: Deploy
      shell: bash
      # `--summary` writes the build table to $GITHUB_STEP_SUMMARY before
      # anything is applied — pass 1 overwrites the deployed tags it reads, and
      # the table is most wanted when the deploy then fails.
      #
      # `set -euo pipefail` is a behaviour change from the bash this replaces,
      # which had no `set -e` and fell through a failing summary into the real
      # deploy. If it proves annoying, the relief valve is
      # `continue-on-error: true` on a separate summary step — not dropping
      # `set -e`.
      env:
        DEPLOY_ENV: ${{ inputs.env }}
      run: |
        set -euo pipefail
        tangier deploy "$DEPLOY_ENV" --summary
