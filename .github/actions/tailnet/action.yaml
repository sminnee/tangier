name: tangier tailnet
description: >-
  Connect the runner to the tailnet as this environment's deploy identity and
  point kubectl at the Tailscale Kubernetes operator.

# READ docs/actions/tailnet.md BEFORE changing a call site. The separation
# between uat and prod is enforced by the `environment:` line on the calling
# job, and it is no longer visible from here.

inputs:
  client-id:
    description: >-
      OAuth client ID for this environment's deploy identity. Pass
      `${{ vars.TS_DEPLOY_CLIENT_ID }}` — a composite action cannot read the
      `vars` context at all (actions/runner#2551), so it must be forwarded.
      The value differs per environment; the NAME is deliberately the same.
    required: true
  audience:
    description: >-
      OIDC audience for this environment. Pass `${{ vars.TS_DEPLOY_AUDIENCE }}`.
      Same reasoning, and the same deliberate name-sharing, as `client-id`.
    required: true
  env:
    description: >-
      Environment name, used to look up `[tailnet.<env>] tag` in pipeline.toml.
      Omit when passing `tag` directly.
    required: false
    default: ""
  tag:
    description: >-
      Tailnet ACL tag, overriding config. For a repo with no pipeline.toml —
      k8s-cluster is helm and kubectl with no images, and a config describing
      no tags, buckets or images would misrepresent it and trip
      `_warn_tags_without_input`.
    required: false
    default: ""
  operator:
    description: >-
      Tailscale Kubernetes operator hostname, overriding `[tailnet] operator`.
      Defaults to `tailscale-operator` when there is no config to read.
    required: false
    default: ""
  version:
    description: >-
      Tailscale release to install. Defaults to the release pinned in
      resolve.sh. The OIDC exchange needs 1.90.1 or later, so do not pin
      below that, and never pass `latest`.
    required: false
    default: ""

outputs:
  tag:
    description: The tailnet tag this runner authenticated as.
    value: ${{ steps.resolve.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Resolve the tag, operator and version
      id: resolve
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_OPERATOR: ${{ inputs.operator }}
        INPUT_VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    - name: Connect to the tailnet
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.client-id }}
        audience: ${{ inputs.audience }}
        tags: ${{ steps.resolve.outputs.tag }}
        version: ${{ steps.resolve.outputs.version }}
        use-cache: "true"
        args: --advertise-tags=${{ steps.resolve.outputs.tag }}

    - name: Point kubectl at the operator
      shell: bash
      env:
        OPERATOR: ${{ steps.resolve.outputs.operator }}
      run: |
        set -euo pipefail
        tailscale configure kubeconfig "$OPERATOR"
        kubectl config current-context
