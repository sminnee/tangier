# The caller repo that the `build-action` CI job builds with the build action.

[registry]
url = "ghcr.io/sminnee/tangier-ci-fixture"

[fixture]
paths = "app/**"
sha   = true

[image.fixture]
dockerfile = "app/Dockerfile"
context    = "app"

# Built for linux/amd64 and linux/arm64 by the `build-action-multiplatform`
# and `build-action-merge` jobs.
[multi]
paths = "multi/**"
sha   = true

[image.multi]
dockerfile = "multi/Dockerfile"
context    = "multi"
