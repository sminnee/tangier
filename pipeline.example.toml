# A starter `pipeline.toml`, in the shape of a real monorepo: a shared library,
# an API service split into subsystems, a worker, a web frontend, and e2e tests.
#
# Copy it to `pipeline.toml` at your repo root and edit it. Every key is in
# skills/tangier/reference/pipeline-toml.md. The guide in docs/guide/ explains
# the patterns.

# --- Registry and runners ----------------------------------------------------

[registry]
url = "registry.example.com/myorg"

[runners]
unittest = { cmd = "bin/test", files = "unittest-files" }
e2e      = { cmd = "bin/e2e-test" }

# --- Shared library ----------------------------------------------------------

[shared]
paths          = "lib/shared/**"
unittest_items = "lib/shared"

# --- Services: one SHA bucket and one image each -----------------------------

# The image bucket covers the whole service. It carries no test excludes,
# because test files ship in the image and must move its tag.
[api]
paths   = "service/api/**"
depends = "shared"
sha     = true
touched = true

[worker]
paths          = "service/worker/**"
depends        = "shared"
sha            = true
touched        = true
unittest_items = "service/worker"

[webapp]
paths   = ["frontend/**", "pnpm-lock.yaml"]
sha     = true
touched = true

# --- API subsystems: backend and UI tags -------------------------------------

# Code every subsystem uses. A change here runs every subsystem.
[api-core]
paths          = "service/api/api/core/**"
exclude        = ["**/*_test.py"]
depends        = "shared"
unittest_items = "service/api/api/core"

# A subsystem's backend. Test files are excluded so that a test-only change
# runs no e2e; `[unittest-files]` still sends the changed test to the runner.
[billing]
paths          = "service/api/api/billing/**"
exclude        = ["**/*_test.py"]
depends        = "api-core"
unittest_items = "service/api/api/billing"

# The same subsystem's UI. A backend change runs this e2e suite too.
[billing-ui]
paths     = ["frontend/src/billing/**", "integration-tests/billing/**"]
depends   = ["billing", "e2e"]
e2e_items = "integration-tests/billing"

# The e2e hub: every `-ui` tag depends on it.
[e2e]
paths = ["playwright.config.ts", "integration-tests/_lib/**", "frontend/src/ui/**"]

# --- File-sets ----------------------------------------------------------------

[unittest-files]
files = true
paths = ["service/api/**/*_test.py", "service/worker/**/*_test.py", "lib/shared/**/*_test.py"]

# --- Cross-cutting -----------------------------------------------------------

# `k8s` is a reserved name, so the tag is nested. Its output is `k8s-touched`.
[tags.k8s]
paths   = "k8s/**"
touched = true

# --- Gates ---------------------------------------------------------------------

# Commands run without a shell. A placeholder becomes a list from the diff.
[gate]
# `tangier gate sync` deletes a record whose newest run is older than this.
# prune-after-days = 90

[gate.test-backend]
cmd   = "bin/test --dirs {unittest-items} --files {unittest-files}"
scope = ["api", "worker", "backend-inputs"]

# A group: each member keeps its own record.
[gate.lint]
scope = ["api", "worker", "backend-inputs"]

[gate.lint.pyright]
cmd = "uv run pyright"

[gate.lint.ruff]
cmd = ["uv run ruff check .", "uv run ruff format --check ."]

# Files the gate's commands read that no service covers. No `sha`, so it is
# not an image.
[backend-inputs]
paths = ["uv.lock", "pyproject.toml", "pipeline.toml", "bin/test"]

# --- Images --------------------------------------------------------------------

[image.api]
dockerfile = "service/api/Dockerfile"

[image.worker]
dockerfile = "service/worker/Dockerfile"

[image.webapp]
dockerfile = "frontend/Dockerfile"
secrets    = ["sentry_auth_token"]

# --- Deploy (optional) ---------------------------------------------------------

[k8s.api]
deployments = ["api", "api-worker"]

[k8s.worker]
container = "worker"

[k8s.webapp]

[deploy.uat]
namespace     = "myorg-uat"
overlay       = "k8s/overlays/uat"
migration_job = "api-migrate-${API_VERSION}"
migration_version_bucket = "api"

[tailnet.uat]
tag = "tag:myorg-uat-deploy"
